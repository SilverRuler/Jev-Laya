name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build

  server:
    name: server (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: server
      - run: uv run ruff check .
        working-directory: server
      - run: uv run python -c "import schemas, laya_engine"
        working-directory: server